<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>udaSimulator</title>

  <!-- css files -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/bars.css">
  <link rel="stylesheet" href="css/uda.css">
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>

  <div id="game">
  <!-- The room -->
  <div id="panel-room">
    <div id="elf-sprite"></div>
  </div>

  <!-- Bars -->
  <div id="panel-bars">
    <div class="bar-row">
      <span class="bar-label">HP</span>
      <div class="bar-track"><div id="bar-hp" class="bar" style="width: 100%"></div></div>
    </div>
    <div class="bar-row">
      <span class="bar-label">Money</span>
      <div class="bar-track"><div id="bar-money" class="bar" style="width: 0%"></div></div>
    </div>
    <div class="bar-row">
      <span class="bar-label">Sleep</span>
      <div class="bar-track"><div id="bar-sleep" class="bar" style="width: 100%"></div></div>
    </div>
    <div class="bar-row">
      <span class="bar-label">Mood</span>
      <div class="bar-track"><div id="bar-mood" class="bar" style="width: 100%"></div></div>
   </div>


 <div id="buttons">
      <img id="workButton"  src="assets/room/pc.png" alt="computer">
      <img id="eatButton"   src="assets/room/food.png" alt="food">
      <img id="sleepButton" src="assets/room/bed.png" alt="bed">
      <img id="drinkButton" src="assets/room/whiskey.png" alt="whiskey">
    </div>
  </div>

  <!-- Event log -->
  <div id="panel-log">
    <h2>Event Log</h2>
    <div id="event-log"></div>
  </div>

</div>

  <script type="module" src="js/states.js"></script> 
  <script type="module" src="js/rules.js"></script>
  <script type="module" src="js/events.js"></script> 
  <script type="module" src="js/ui.js"></script>   
  <script type="module" src="js/main.js"></script> 

</body>
</body>
</html>
